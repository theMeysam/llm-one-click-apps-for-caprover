captainVersion: 4
services:
  $$cap_appname:
    image: ghcr.io/open-webui/open-webui:$$cap_webui_version
    environment:
      OLLAMA_BASE_URL: http://srv-captain--$$cap_appname-ollama:11434
      WEBUI_SECRET_KEY: $$cap_webui_secret
    volumes:
      - $$cap_appname-data:/app/backend/data
    caproverExtra:
      containerHttpPort: 8080
  $$cap_appname-ollama:
    image: ollama/ollama:$$cap_ollama_version
    volumes:
      - $$cap_appname-ollama-data:/root/.ollama
    caproverExtra:
      notExposeAsWebApp: 'true'
caproverOneClickApp:
  variables:
    - id: $$cap_webui_version
      label: Open WebUI Version
      defaultValue: 'v0.11.4'
      description: Pinned stable Open WebUI release.
      validRegex: /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - id: $$cap_ollama_version
      label: Ollama Version
      defaultValue: '0.35.1'
      description: Pinned stable Ollama release bundled privately with Open WebUI.
      validRegex: /^[0-9]+\.[0-9]+\.[0-9]+$/
    - id: $$cap_webui_secret
      label: WebUI Secret Key
      defaultValue: $$cap_gen_random_hex(32)
      description: Secret used by Open WebUI for signing and encryption.
      validRegex: /.{16,}/
  instructions:
    start: |-
      Open WebUI with a private bundled Ollama backend. This uses the current OLLAMA_BASE_URL variable; the old OLLAMA_API_BASE_URL variable is deprecated.
    end: |-
      Open WebUI is deployed at https://$$cap_appname.$$cap_root_domain
      Enable HTTPS in CapRover before production use.
  displayName: Open WebUI + Ollama
  isOfficial: false
  baseUrl: https://github.com/open-webui/open-webui
  description: Self-hosted AI web interface with a private bundled Ollama backend.
  documentation: https://docs.openwebui.com/
